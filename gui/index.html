<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EMTSim Circuit Editor</title>
<style>
  :root {
    --navy: #1F2537; --teal: #21A99B; --teal-d: #178478; --amber: #F2A93B; --err: #D64545; --orange: #E8833A;
    --bg: #F4F5F7; --panel: #FFFFFF; --line: #DADDE3; --text: #1F2537; --muted: #6B7280; --sym: #1F2537;
    --grid: #C9CED6; --bottom-h: 40vh;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 13px/1.4 "Segoe UI", system-ui, -apple-system, sans-serif; overflow: hidden; }
  button, select, input { font: inherit; color: inherit; }
  button { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover { border-color: var(--teal); }
  button.primary { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--teal-d); }
  button:disabled { opacity: .55; cursor: default; }
  input[type=text], select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; background: #fff; }
  input[type=text]:focus, select:focus { outline: 2px solid rgba(33,169,155,.35); border-color: var(--teal); }

  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: var(--navy); color: #fff; flex: none; }
  header .brand { font-weight: 700; font-size: 16px; margin-right: 10px; white-space: nowrap; }
  header .brand span { color: var(--teal); }
  header .brand small { font-weight: 400; color: #AEB6C4; margin-left: 6px; font-size: 12px; }
  header input[type=text] { width: 170px; color: var(--text); }
  header button:not(.primary), header select { background: #2C3349; border-color: #3B4560; color: #fff; }
  header .spacer { flex: 1; }
  #status { font-size: 12px; color: #C9D1DD; max-width: 38vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: #FF9C9C; } #status.ok { color: #8FE3D9; }

  #main { flex: 1; display: flex; min-height: 0; }
  #palette { width: 124px; flex: none; background: var(--panel); border-right: 1px solid var(--line); padding: 6px 5px;
             display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 2px; overflow-y: auto; }
  #palette hr, #palette .pal-h { grid-column: 1 / -1; }
  #palette .pal-h { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 2px 0; }
  .tool { display: flex; flex-direction: column; align-items: center; gap: 0; padding: 3px 2px; border-radius: 8px;
          border: 1px solid transparent; background: none; font-size: 10px; line-height: 1.2; color: var(--muted); }
  .tool svg { width: 40px; height: 20px; }
  .tool svg * { fill: none; stroke: var(--sym); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .tool:hover { background: #F0F7F6; border-color: transparent; }
  .tool.active { background: #E3F4F2; border-color: var(--teal); color: var(--teal-d); }
  #palette hr { width: 100%; border: 0; border-top: 1px solid var(--line); margin: 4px 0; }

  #canvasWrap { flex: 1; position: relative; min-width: 0; background: #FBFBFC; }
  #sch { width: 100%; height: 100%; display: block; user-select: none; }
  #sch.pan { cursor: grabbing; } #sch.place, #sch.wire { cursor: crosshair; }
  #hint { position: absolute; left: 10px; bottom: 8px; background: rgba(31,37,55,.85); color: #fff; padding: 4px 10px;
          border-radius: 6px; font-size: 12px; pointer-events: none; }
  #zoom { position: absolute; right: 10px; bottom: 8px; display: flex; gap: 4px; }
  #zoom button { padding: 3px 9px; }
  #banner { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: #FFF6E6; border: 1px solid var(--amber);
            color: #6B4A00; padding: 8px 14px; border-radius: 8px; max-width: 80%; display: none; }
  #toggles { position: absolute; right: 10px; top: 8px; background: rgba(255,255,255,.9); border: 1px solid var(--line);
             border-radius: 6px; padding: 3px 8px; font-size: 12px; }

  .comp path, .comp rect, .comp circle, .ghost path, .ghost rect, .ghost circle {
    fill: none; stroke: var(--sym); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .comp circle.dot, .ghost circle.dot { fill: var(--sym); }
  .comp .bolt, .ghost .bolt { stroke: var(--err); }
  .comp text.sy, .ghost text.sy { fill: var(--sym); stroke: none; font: 15px Georgia, serif; }
  .comp.sel text.sy { fill: var(--teal); }
  .comp .thick, .ghost .thick { stroke-width: 3.2; }
  .comp .thin, .ghost .thin { stroke-width: 1.5; }
  .comp .hit { stroke: none; fill: transparent; cursor: move; }
  .comp.sel path, .comp.sel rect, .comp.sel circle:not(.dot) { stroke: var(--teal); }
  .comp.sel circle.dot { fill: var(--teal); stroke: var(--teal); }
  .ghost { opacity: .45; pointer-events: none; }
  .lbl { font-size: 11px; fill: var(--navy); font-weight: 600; pointer-events: none; }
  .val { font-size: 10.5px; fill: var(--muted); pointer-events: none; }
  .wire { stroke: var(--navy); stroke-width: 2; stroke-linecap: round; }
  .wire.sel { stroke: var(--teal); stroke-width: 3; }
  .wire.w3 { stroke-width: 3.4; }
  .wire.w3.sel { stroke-width: 4.2; }
  .wticks { stroke: var(--navy); stroke-width: 1.5; fill: none; pointer-events: none; stroke-linecap: round; }
  .wirehit { stroke: transparent; stroke-width: 12; cursor: pointer; }
  .preview { stroke: var(--teal); stroke-width: 2; stroke-dasharray: 5 4; fill: none; pointer-events: none; }
  .junction { fill: var(--navy); }
  .dangling { fill: #fff; stroke: var(--err); stroke-width: 2; }
  .term { fill: #fff; stroke: var(--teal); stroke-width: 1.5; pointer-events: none; }
  .badge rect { fill: var(--teal); } .badge text { fill: #fff; font-size: 10px; font-weight: 700; }
  .badge { pointer-events: none; }

  #props { width: 290px; flex: none; background: var(--panel); border-left: 1px solid var(--line); padding: 12px 14px; overflow-y: auto; }
  #props h3 { margin: 0 0 8px; font-size: 14px; }
  #props .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .field .row { display: flex; align-items: center; gap: 6px; }
  .field input[type=text], .field select { flex: 1; min-width: 0; }
  .field .unit { color: var(--muted); width: 22px; }
  .field .parsed { font-size: 11px; color: var(--muted); margin-top: 2px; min-height: 14px; }
  .field .parsed.bad { color: var(--err); }
  .msgs { margin: 8px 0; padding: 0; list-style: none; }
  .msgs li { padding: 5px 8px; border-radius: 6px; margin-bottom: 4px; font-size: 12px; }
  .msgs li.e { background: #FDECEC; color: #A12C2C; } .msgs li.w { background: #FFF6E6; color: #7A5300; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 12px; margin-bottom: 10px; }
  .kv b { font-weight: 600; }
  .help { font-size: 12px; color: var(--muted); padding-left: 16px; margin: 6px 0; }
  .help li { margin-bottom: 3px; }
  .btnrow { display: flex; gap: 6px; margin-top: 6px; }

  #splitter { height: 6px; flex: none; cursor: row-resize; background: var(--line); border-top: 1px solid #CDD1D8; }
  #bottom { height: var(--bottom-h); flex: none; display: flex; flex-direction: column; background: var(--panel); min-height: 80px; }
  #tabs { display: flex; align-items: center; gap: 2px; padding: 0 10px; border-bottom: 1px solid var(--line); flex: none; }
  #tabs .tab { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 8px 12px; background: none; color: var(--muted); }
  #tabs .tab.active { color: var(--text); border-bottom-color: var(--teal); font-weight: 600; }
  #tabs .spacer { flex: 1; }
  #tabs label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #tabs input[type="checkbox"] { width: auto; min-width: 0; margin: 0; padding: 0; }
  #tabs input { width: 110px; padding: 2px 6px; }
  .pane { flex: 1; overflow: auto; padding: 10px 12px; display: none; }
  .pane.active { display: block; }
  pre { margin: 0; font: 12px/1.45 Consolas, "Cascadia Mono", monospace; white-space: pre; }
  #summary { margin-bottom: 8px; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; }
  #summary .chip { background: #EEF1F4; border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  #summary .chip b { font-weight: 600; }
  .legend { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 18px; height: 0; border-top: 2px solid var(--teal); }
  .legend i.py { border-top: 2px dashed #1F2537; }
  .legend i.ov { border-top: 2px dashed #8A8F98; }
  #plots { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 8px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px 2px; background: #fff; }
  .card .ttl { font-size: 12px; font-weight: 600; display: flex; justify-content: space-between; }
  .card .ttl span { font-weight: 400; color: var(--muted); }
  .card canvas { width: 100%; height: 130px; display: block; cursor: crosshair; }
  .card.wide { grid-column: 1 / -1; }
  .card.wide canvas { height: 340px; }
  .card .big { border: none; background: none; padding: 0 2px 0 8px; color: var(--muted); font-size: 13px; line-height: 1; }
  .card .big:hover { color: var(--teal); }
  .lnk { border: none; background: none; padding: 0 0 0 6px; color: var(--teal-d); text-decoration: underline; font-size: 12px; }
  .empty { color: var(--muted); padding: 20px; text-align: center; grid-column: 1 / -1; }

  .modal { position: fixed; inset: 0; background: rgba(15,20,30,.45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal.hidden { display: none; }
  .dialog { background: #fff; border-radius: 10px; width: min(460px, 92vw); max-height: 80vh; display: flex; flex-direction: column; box-shadow: 0 10px 40px rgba(0,0,0,.25); }
  .dialog h3 { margin: 0; padding: 14px 16px; border-bottom: 1px solid var(--line); font-size: 15px; }
  .dialog .list { overflow-y: auto; padding: 6px; }
  .dialog .item { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .dialog .item:hover { background: #EEF7F6; }
  .dialog .item small { color: var(--muted); }
  .dialog .foot { padding: 10px 16px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
</style>
</head>
<body>
<header>
  <div class="brand">EMT<span>Sim</span><small>circuit editor</small></div>
  <input type="text" id="fileName" value="my_circuit" title="File name (saved in circuits/)">
  <button id="btnNew" title="New circuit">New</button>
  <button id="btnOpen" title="Open a circuit from circuits/">Open…</button>
  <button id="btnSave" title="Save to circuits/ (Ctrl+S)">Save</button>
  <button id="btnDownload" title="Download the .net file">Download</button>
  <select id="phaseMode" title="Single-phase or three-phase drawing (changing it converts the drawing)">
    <option value="1">1-phase</option>
    <option value="3">3-phase</option>
  </select>
  <div class="spacer"></div>
  <div id="status"></div>
  <select id="engine" title="Which simulator to run">
    <option value="cpp">C++</option>
    <option value="python">Python</option>
    <option value="both">Both (compare)</option>
  </select>
  <button class="primary" id="btnRun" title="Run the simulation (F5)">▶ Run</button>
</header>

<div id="main">
  <aside id="palette"></aside>
  <div id="canvasWrap">
    <svg id="sch" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
          <circle cx="0" cy="0" r="1.1" fill="#C3C8D0"/><circle cx="20" cy="0" r="1.1" fill="#C3C8D0"/>
          <circle cx="0" cy="20" r="1.1" fill="#C3C8D0"/><circle cx="20" cy="20" r="1.1" fill="#C3C8D0"/>
        </pattern>
      </defs>
      <rect id="bg" fill="url(#dots)"/>
      <g id="gWires"></g><g id="gComps"></g><g id="gMarks"></g><g id="gOverlay"></g>
    </svg>
    <div id="banner"></div>
    <label id="toggles"><input type="checkbox" id="showNodes" checked> node numbers</label>
    <div id="hint"></div>
    <div id="zoom"><button id="zIn" title="Zoom in">+</button><button id="zOut" title="Zoom out">−</button><button id="zFit" title="Fit circuit">Fit</button></div>
  </div>
  <aside id="props"></aside>
</div>

<div id="splitter" title="Drag to resize"></div>
<section id="bottom">
  <div id="tabs">
    <button class="tab active" data-tab="results">Results</button>
    <button class="tab" data-tab="netlist">Netlist</button>
    <button class="tab" data-tab="log">Log</button>
    <div class="spacer"></div>
    <label><select id="resultKind" title="Node voltages, or branch currents and machine quantities">
      <option value="V">Voltages</option><option value="I">Currents</option></select></label>
    <label title="Keep this run and the zoom as a reference: later runs are drawn over it (grey dashed) until unticked"><input type="checkbox" id="hold"> Hold run</label>
    <label id="filterLabel">Show nodes <input type="text" id="nodeFilter" value="all" title="all, or e.g. 1,3,5-8; for currents, part of a name"></label>
  </div>
  <div class="pane active" id="pane-results">
    <div id="summary"></div>
    <div id="plots"><div class="empty">Draw a circuit and press ▶ Run to see the node voltages here.</div></div>
  </div>
  <div class="pane" id="pane-netlist"><ul class="msgs" id="netMsgs"></ul><pre id="netText"></pre></div>
  <div class="pane" id="pane-log"><pre id="logText">No simulation run yet.</pre></div>
</section>

<div class="modal hidden" id="openDialog">
  <div class="dialog">
    <h3>Open a circuit</h3>
    <div class="list" id="openList"></div>
    <div class="foot">
      <label><input type="file" id="fileInput" accept=".net,.txt" style="display:none"><button id="btnUpload">From your computer…</button></label>
      <button id="btnCloseOpen">Cancel</button>
    </div>
  </div>
</div>

<script src="schematic.js"></script>
<script>
'use strict';
const S = window.Schematic;
const G = 20;                 // pixels per grid unit
const $ = (id) => document.getElementById(id);
const svg = $('sch');

// ------------------------------------------------------------------ state
let model = { v: 1, components: [], wires: [] };
let raw = null;               // netlist text loaded without a drawing
let tool = 'select';          // 'select' | 'wire' | component type
let placeRot = 0;
let sel = null;               // { kind: 'comp', id } | { kind: 'wire', index }
let mouseG = [0, 0];
let wireStart = null;
let drag = null, pan = null;
let undoStack = [], redoStack = [];
let net = null;               // last S.buildNetlist() result
let results = null;           // last /api/run response
let dirty = false;
let view = { x: -60, y: -60, s: 1 };

// ------------------------------------------------------------------ palette
const ICONS = {
  select: '<path d="M14 4 L14 20 L18 16 L21 22 L23 21 L20 15 L26 15 Z" style="fill:#fff"/>',
  wire: '<path d="M6 18 H22 V6 H38"/><circle cx="22" cy="18" r="2" style="fill:#1F2537"/>',
  R: '<path d="M2 12 H12 M32 12 H42"/><rect x="12" y="7" width="20" height="10"/>',
  L: '<path d="M2 12 H10 M34 12 H42 M10 12 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0 a3 3 0 0 1 6 0"/>',
  C: '<path d="M2 12 H19 M25 12 H42"/><path d="M19 4 V20 M25 4 V20" style="stroke-width:2.6"/>',
  V: '<path d="M2 12 H12 M32 12 H42"/><circle cx="22" cy="12" r="10"/><path d="M16 12 q3 -6 6 0 t6 0"/>',
  SW: '<path d="M2 12 H13 M31 12 H42 M13 12 L29 4"/><circle cx="13" cy="12" r="2" style="fill:#1F2537"/><circle cx="31" cy="12" r="2" style="fill:#1F2537"/>',
  F: '<path d="M2 12 H13 M31 12 H42"/><path d="M13 12 L18 6 L21 15 L25 8 L31 12" style="stroke:#D64545"/>',
  F3: '<path d="M22 1 V5"/><path d="M22 5 L17 9 L26 12 L18 16 L22 18" style="stroke:#D64545"/><path d="M22 18 V20 M14 20 H30 M17 23 H27"/>',
  GND: '<path d="M22 2 V12 M12 12 H32 M16 16 H28 M20 20 H24"/>',
  PI: '<path d="M2 12 H12 M32 12 H42"/><rect x="12" y="6" width="20" height="12"/><text x="22" y="16" text-anchor="middle" style="font:11px serif;fill:#1F2537;stroke:none">π</text>',
  TL: '<path d="M2 12 H12 M32 12 H42 M12 8 H32 M12 16 H32 M12 8 V16 M32 8 V16"/>',
  XF: '<path d="M2 12 H12 M32 12 H42"/><circle cx="18" cy="12" r="7"/><circle cx="26" cy="12" r="7"/>',
  MOV: '<path d="M2 12 H12 M32 12 H42"/><rect x="12" y="7" width="20" height="10"/><path d="M9 19 L35 5"/>',
  D: '<path d="M2 12 H16 M28 12 H42 M16 5 V19 L28 12 Z M28 5 V19"/>',
  THY: '<path d="M2 12 H16 M28 12 H42 M16 5 V19 L28 12 Z M28 5 V19 M26 15 L32 22"/>',
  RL3: '<path d="M2 12 H12 M32 12 H42"/><rect x="12" y="6" width="20" height="12"/><text x="22" y="16" text-anchor="middle" style="font:10px sans-serif;fill:#1F2537;stroke:none">Z</text>',
  SM: '<path d="M22 1 V5"/><circle cx="22" cy="14" r="9"/><text x="22" y="18" text-anchor="middle" style="font:10px sans-serif;fill:#1F2537;stroke:none">G</text>',
  IM: '<path d="M22 1 V5"/><circle cx="22" cy="14" r="9"/><text x="22" y="18" text-anchor="middle" style="font:10px sans-serif;fill:#1F2537;stroke:none">M</text>',
};
const TICKS_ICON = '<path d="M3 16 L7 8 M6 16 L10 8 M9 16 L13 8" style="stroke-width:1.1"/>';   // "///" = three-phase
const LABELS = { R: 'Resistor', L: 'Inductor', C: 'Capacitor', V: 'Source', SW: 'Switch', F: 'Fault',
                 PI: 'Line π', TL: 'Line TL', XF: 'Transformer', MOV: 'Arrester', D: 'Diode', THY: 'Thyristor',
                 RL3: 'Coupled RL', SM: 'Generator', IM: 'Motor' };

// The palette shows single-phase or three-phase components, depending on the drawing's mode
function buildPalette() {
  const three = model.phases === 3;
  const pal = $('palette');
  pal.innerHTML = '';
  const tool1 = (t) => ({
    id: three ? S.TO3[t] : t,
    label: LABELS[t],
    icon: three && t === 'F' ? ICONS.F3 : ICONS[t] + (three ? TICKS_ICON : ''),
  });
  const own = (t) => ({ id: t, label: LABELS[t], icon: ICONS[t] + (t === 'RL3' ? TICKS_ICON : '') });
  const items = [{ id: 'select', label: 'Select', icon: ICONS.select }, { id: 'wire', label: 'Wire (W)', icon: ICONS.wire },
                 { h: three ? 'Three-phase' : 'Basic' }]
    .concat(['R', 'L', 'C', 'V', 'SW', 'F'].map(tool1))
    .concat([{ h: 'Network' }], ['PI', 'TL', 'XF', 'MOV'].map(tool1))
    .concat(three ? [own('RL3')] : [])
    .concat(three ? [{ h: 'Machines' }, own('SM'), own('IM')] : [{ h: 'Electronics' }, own('D'), own('THY')])
    .concat([{ h: '' }, { id: 'GND', label: 'Ground', icon: ICONS.GND }]);
  for (const t of items) {
    if (t === 'hr') { pal.appendChild(document.createElement('hr')); continue; }
    if (t.h !== undefined) { const d = document.createElement('div'); d.className = 'pal-h'; d.textContent = t.h; pal.appendChild(d); continue; }
    const b = document.createElement('button');
    b.className = 'tool' + (t.id === tool ? ' active' : ''); b.dataset.tool = t.id;
    b.title = S.TYPES[t.id] ? S.TYPES[t.id].label : t.label;
    b.innerHTML = '<svg viewBox="0 0 44 24">' + t.icon + '</svg>' + t.label;
    b.onclick = () => setTool(t.id);
    pal.appendChild(b);
  }
  if (S.TYPES[tool] && tool !== 'GND' && S.isThree(tool) !== three) setTool('select');
}
// Keep the mode selector and the palette in step with the model
function syncPhaseUI() {
  $('phaseMode').value = model.phases === 3 ? '3' : '1';
  buildPalette();
}

function setTool(t) {
  tool = t; wireStart = null;
  document.querySelectorAll('.tool').forEach((b) => b.classList.toggle('active', b.dataset.tool === t));
  svg.classList.toggle('place', !!S.TYPES[t]);
  svg.classList.toggle('wire', t === 'wire');
  updateHint(); renderOverlay();
}

function updateHint() {
  $('hint').textContent =
    tool === 'select' ? 'Click to select · drag to move · R rotate · Del delete · drag background to pan · wheel to zoom' :
    tool === 'wire' ? (wireStart ? 'Click to add a corner/end · ending on a terminal or wire finishes · Esc or right-click to stop'
                                 : 'Click a point to start a wire') :
    'Click to place ' + S.TYPES[tool].label.toLowerCase() + ' · R rotate · Esc when done';
}

// ------------------------------------------------------------------ view
function applyView() {
  const r = svg.getBoundingClientRect();
  const w = r.width / view.s, h = r.height / view.s;
  svg.setAttribute('viewBox', view.x + ' ' + view.y + ' ' + w + ' ' + h);
  const bg = $('bg');
  bg.setAttribute('x', Math.floor(view.x / G) * G); bg.setAttribute('y', Math.floor(view.y / G) * G);
  bg.setAttribute('width', w + 2 * G); bg.setAttribute('height', h + 2 * G);
}
function toWorld(ev) {
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return [p.x, p.y];
}
function zoomAt(factor, clientX, clientY) {
  const r = svg.getBoundingClientRect();
  if (clientX === undefined) { clientX = r.left + r.width / 2; clientY = r.top + r.height / 2; }
  const w = toWorld({ clientX, clientY });
  view.s = Math.min(4, Math.max(0.02, view.s * factor));
  view.x = w[0] - (clientX - r.left) / view.s;
  view.y = w[1] - (clientY - r.top) / view.s;
  applyView();
}
function fit() {
  const pts = [];
  for (const c of model.components) for (const p of S.terminals(c)) pts.push(p);
  for (const w of model.wires) pts.push([w.x1, w.y1], [w.x2, w.y2]);
  const r = svg.getBoundingClientRect();
  if (!pts.length) { view = { x: -60, y: -60, s: 1 }; applyView(); return; }
  const xs = pts.map((p) => p[0] * G), ys = pts.map((p) => p[1] * G);
  const x0 = Math.min(...xs) - 60, x1 = Math.max(...xs) + 170, y0 = Math.min(...ys) - 60, y1 = Math.max(...ys) + 60;
  view.s = Math.min(2, Math.max(0.02, Math.min(r.width / (x1 - x0), r.height / (y1 - y0))));
  view.x = (x0 + x1) / 2 - r.width / view.s / 2;
  view.y = (y0 + y1) / 2 - r.height / view.s / 2;
  applyView();
}

// ------------------------------------------------------------------ drawing
const lead = (a, b) => '<path d="M' + a + ' 0 H' + b + '"/>';
function symbol(c) {
  const P = c.params || {};
  switch (c.type) {
    case 'R': return lead(0, 20) + lead(60, 80) + '<rect x="20" y="-8" width="40" height="16" rx="1.5"/>';
    case 'L': return lead(0, 20) + lead(60, 80) + '<path d="M20 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0 a5 5 0 0 1 10 0"/>';
    case 'C': return lead(0, 36) + lead(44, 80) + '<path class="thick" d="M36 -13 V13 M44 -13 V13"/>';
    case 'V': return lead(0, 22) + lead(58, 80) + '<circle cx="40" cy="0" r="18"/><path d="M29 0 q5.5 -11 11 0 t11 0"/>' +
                     '<path class="thin" d="M64 -13 h8 M68 -17 v8 M8 -13 h8"/>';
    case 'SW': return lead(0, 24) + lead(56, 80) + '<circle class="dot" cx="24" cy="0" r="3"/><circle class="dot" cx="56" cy="0" r="3"/>' +
                      (P.state === 'open' ? '<path d="M24 0 L53 -16"/>' : '<path d="M24 0 L56 -3"/>');
    case 'F': return lead(0, 26) + lead(54, 80) + '<path class="bolt" d="M26 0 L35 -11 L41 6 L47 -7 L54 0"/>';
    case 'GND': return '<path d="M0 0 V12 M-13 12 H13 M-8 17.5 H8 M-3 23 H3"/>';
    // three-phase: the single-phase symbol with "///" on its first lead
    case 'R3': case 'L3': case 'C3': case 'V3':
      return symbol({ type: c.type.slice(0, 1), params: P }) + TICKS;
    case 'SW3':
      return symbol({ type: 'SW', params: { state: P.mode === 'independent' ? P.state_a : P.state } }) + TICKS;
    case 'PI': case 'PI3':
      return lead(0, 20) + lead(60, 80) + '<rect x="20" y="-9" width="40" height="18" rx="1.5"/>' +
             '<text class="sy" x="40" y="5" text-anchor="middle">π</text>' + (c.type === 'PI3' ? TICKS : '');
    case 'TL': case 'TL3':
      return lead(0, 20) + lead(60, 80) + '<path d="M20 -6 H60 M20 6 H60 M20 -6 V6 M60 -6 V6"/>' + (c.type === 'TL3' ? TICKS : '');
    case 'RL3':
      return lead(0, 20) + lead(60, 80) + '<rect x="20" y="-9" width="40" height="18" rx="1.5"/>' +
             '<text class="sy" x="40" y="5" text-anchor="middle" style="font-family:sans-serif;font-size:12px">Z</text>' + TICKS;
    case 'XF': case 'XF3':
      return lead(0, 23) + lead(57, 80) + '<circle cx="34" cy="0" r="11"/><circle cx="46" cy="0" r="11"/>' +
             (c.type === 'XF3' ? TICKS : '');
    case 'MOV': case 'MOV3':
      return lead(0, 20) + lead(60, 80) + '<rect x="20" y="-8" width="40" height="16" rx="1.5"/><path class="thin" d="M16 12 L64 -12"/>' +
             (c.type === 'MOV3' ? TICKS : '');
    case 'D':
      return lead(0, 30) + lead(50, 80) + '<path d="M30 -10 V10 L50 0 Z M50 -10 V10"/>';
    case 'THY':
      return lead(0, 30) + lead(50, 80) + '<path d="M30 -10 V10 L50 0 Z M50 -10 V10"/><path class="thin" d="M47 4 L56 14"/>';
    case 'SM': case 'IM':
      return '<path d="M0 0 V8"/><circle cx="0" cy="23" r="15"/>' +
             '<text class="sy" x="0" y="28" text-anchor="middle" style="font-family:sans-serif;font-size:14px">' + (c.type === 'SM' ? 'G' : 'M') + '</text>' +
             (c.type === 'SM' ? '<path class="thin" d="M-8 34 q4 -5 8 0 t8 0"/>' : '');
    case 'F3': {   // single terminal, pointing down; with ground symbol for faults to ground
      const toGround = !P.kind || String(P.kind).endsWith('-g');
      return '<path d="M0 0 V8"/><path class="bolt" d="M0 8 L-8 15 L7 21 L-6 27 L0 31"/>' +
             (toGround ? '<path d="M0 31 V36 M-13 36 H13 M-8 41.5 H8 M-3 47 H3"/>' : '<path d="M0 31 V34"/>');
    }
  }
  return '';
}
const TICKS = '<path class="thin" d="M5 5 L9 -5 M9 5 L13 -5 M13 5 L17 -5"/>';

// "closed ⇄ 55, 80 ms"
function switchText(state, times) {
  const ts = S.parseList(times);
  const ms = ts.length && ts.every((t) => t >= 1e-3 && t < 1);
  return (state === 'open' ? 'open' : 'closed') + (!ts.length ? '' : ' ⇄ ' +
         (ms ? ts.map((t) => String(Number((t * 1000).toPrecision(4)))).join(', ') + ' ms'
             : ts.map((t) => (Number.isNaN(t) ? '?' : S.formatSI(t, 's'))).join(', ')));
}
// "20 ms – 40 ms"
function faultText(t0, t1) {
  const si = (x) => (x == null || Number.isNaN(x) ? '?' : S.formatSI(x, 's'));
  return si(S.parseValue(t0)) + ' – ' + (S.parseValue(t1) != null ? si(S.parseValue(t1)) : 'permanent');
}

function valueText(c) {
  const P = c.params || {};
  const v = (k) => S.parseValue(P[k]);
  const si = (x, u) => (x == null || Number.isNaN(x) ? '?' : S.formatSI(x, u));
  switch (c.type) {
    case 'R': return si(v('value'), 'Ω');
    case 'L': return si(v('value'), 'H');
    case 'C': return si(v('value'), 'F');
    case 'V': { const r = v('r'), l = v('l'); return si(v('mag'), 'V') + ' ∠' + (P.angle || '0') + '° ' + si(v('freq'), 'Hz') +
                (l > 0 ? ' · ' + si(r || 0, 'Ω') + ' + ' + si(l, 'H') : r > 0 ? ' · ' + si(r, 'Ω') : ' · ideal'); }
    case 'SW': return switchText(P.state, P.times) + (P.opens === 'at current zero' ? ' · at I = 0' : '');
    case 'PI': return si(v('r'), 'Ω') + ' · ' + si(v('l'), 'H') + ' · ' + si(v('c'), 'F');
    case 'TL': return si(v('zc'), 'Ω') + ' · τ ' + si(v('tau'), 's') + (v('r') > 0 ? ' · ' + si(v('r'), 'Ω') : '');
    case 'XF': case 'XF3': return (c.type === 'XF3' ? (P.conn || 'YNd1') + ' · ' : '') + si(v('S'), 'VA') + ' · ' +
                                  si(v('v1'), 'V') + '/' + si(v('v2'), 'V') + (v('knee') > 0 ? ' · sat' : '');
    case 'MOV': case 'MOV3': return (c.type === 'MOV3' ? '3φ · ' : '') + si(v('vref'), 'V');
    case 'D': return 'diode';
    case 'THY': return 'α ' + (P.alpha || '?') + '°';
    case 'PI3': return si(v('r1'), 'Ω') + ' · ' + si(v('l1'), 'H') + ' · ' + si(v('c1'), 'F');
    case 'RL3': return si(v('r1'), 'Ω') + ' · ' + si(v('l1'), 'H');
    case 'TL3': return si(v('z1'), 'Ω') + ' · τ ' + si(v('tau1'), 's');
    case 'SM': return si(v('S'), 'VA') + ' · Pm ' + (P.Pm || '?') + ' pu';
    case 'IM': return si(v('S'), 'VA') + ' · load ' + (P.Tload || '?') + ' pu';
    case 'F': return faultText(P.t_apply, P.t_clear);
    case 'R3': case 'L3': case 'C3': return '3φ · ' + valueText({ type: c.type.slice(0, 1), params: P });
    case 'V3': return '3φ · ' + valueText({ type: 'V', params: Object.assign({}, P, { l: P.l1 }) });
    case 'SW3': return P.mode === 'independent'
      ? S.PH.map((p) => p + ': ' + switchText(P['state_' + p], P['times_' + p])).join(' · ')
      : '3 poles: ' + switchText(P.state, P.times) + (P.opens === 'at current zero' ? ' · at I = 0' : '');
    case 'F3': {
      const ph = String(P.kind || 'a-g').replace('-g', '').split('');
      return (P.kind || 'a-g') + ' · ' + (P.mode === 'independent'
        ? ph.map((p) => p + ' ' + faultText(P['t_apply_' + p], P['t_clear_' + p])).join(', ')
        : faultText(P.t_apply, P.t_clear));
    }
  }
  return '';
}

const HALF = { R: 8, L: 5, C: 13, V: 18, SW: 16, F: 11, R3: 8, L3: 5, C3: 13, V3: 18, SW3: 16,
               PI: 9, PI3: 9, TL: 6, TL3: 6, RL3: 9, XF: 11, XF3: 11, MOV: 12, MOV3: 12, D: 10, THY: 14 };
function compSVG(c, cls) {
  if (S.singleTerminal(c.type)) {   // ground and 3-phase fault: drawn at their terminal, pointing down
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const isF = c.type !== 'GND';   // 3-phase fault, machines
    return '<g class="' + cls + '" data-id="' + c.id + '" transform="translate(' + c.x * G + ',' + c.y * G + ')">' + symbol(c) +
           (cls === 'ghost' ? '' : '<rect class="hit" x="-15" y="-4" width="30" height="' + (isF ? 52 : 30) + '"/>') +
           (isF && cls !== 'ghost' ? '<text class="lbl" x="14" y="16">' + esc(c.name) + '</text><text class="val" x="14" y="30">' +
                                     esc(valueText(c)) + '</text>' : '') + '</g>';
  }
  const [a, b] = S.terminals(c);
  const mx = (a[0] + b[0]) / 2 * G, my = (a[1] + b[1]) / 2 * G;
  const horiz = (c.rot || 0) % 180 === 0;
  let s = '<g class="' + cls + '" data-id="' + c.id + '">' +
          '<g transform="translate(' + a[0] * G + ',' + a[1] * G + ') rotate(' + (c.rot || 0) + ')">' + symbol(c) +
          (cls === 'ghost' ? '' : '<rect class="hit" x="0" y="-17" width="80" height="34"/>') + '</g>';
  if (cls !== 'ghost') {
    const esc = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
    const half = HALF[c.type] || 10;   // half-height of the symbol body
    if (horiz) {   // both labels above the symbol, so they never run into parts hanging below
      s += '<text class="lbl" x="' + mx + '" y="' + (my - half - 18) + '" text-anchor="middle">' + esc(c.name) + '</text>' +
           '<text class="val" x="' + mx + '" y="' + (my - half - 5) + '" text-anchor="middle">' + esc(valueText(c)) + '</text>';
    } else {
      s += '<text class="lbl" x="' + (mx + half + 7) + '" y="' + (my - 3) + '">' + esc(c.name) + '</text>' +
           '<text class="val" x="' + (mx + half + 7) + '" y="' + (my + 12) + '">' + esc(valueText(c)) + '</text>';
    }
    if (cls.includes('sel')) for (const p of S.terminals(c)) s += '<circle class="term" cx="' + p[0] * G + '" cy="' + p[1] * G + '" r="3.5"/>';
  }
  return s + '</g>';
}

function render() {
  net = S.buildNetlist(model, { title: $('fileName').value });
  let w = '';
  const three = model.phases === 3;
  model.wires.forEach((wr, i) => {
    const a = 'x1="' + wr.x1 * G + '" y1="' + wr.y1 * G + '" x2="' + wr.x2 * G + '" y2="' + wr.y2 * G + '"';
    const isSel = sel && sel.kind === 'wire' && sel.index === i;
    w += '<line class="wire' + (three ? ' w3' : '') + (isSel ? ' sel' : '') + '" ' + a + '/><line class="wirehit" data-wire="' + i + '" ' + a + '/>';
    const len = Math.hypot(wr.x2 - wr.x1, wr.y2 - wr.y1);
    if (three && len >= 2) {   // "///" across the middle of the wire: three-phase
      const ux = (wr.x2 - wr.x1) / len, uy = (wr.y2 - wr.y1) / len, nx = -uy, ny = ux;
      const mx = (wr.x1 + wr.x2) / 2 * G, my = (wr.y1 + wr.y2) / 2 * G;
      let d = '';
      for (const k of [-1, 0, 1]) {
        const cx = mx + ux * k * 5, cy = my + uy * k * 5;
        d += 'M' + (cx - nx * 6 - ux * 3) + ' ' + (cy - ny * 6 - uy * 3) + ' L' + (cx + nx * 6 + ux * 3) + ' ' + (cy + ny * 6 + uy * 3) + ' ';
      }
      w += '<path class="wticks" d="' + d + '"/>';
    }
  });
  $('gWires').innerHTML = w;
  $('gComps').innerHTML = model.components.map((c) =>
    compSVG(c, 'comp' + (sel && sel.kind === 'comp' && sel.id === c.id ? ' sel' : ''))).join('');
  let m = '';
  for (const [x, y] of net.junctions) m += '<circle class="junction" cx="' + x * G + '" cy="' + y * G + '" r="4"/>';
  for (const [x, y] of net.dangling) m += '<circle class="dangling" cx="' + x * G + '" cy="' + y * G + '" r="4.5"/>';
  if ($('showNodes').checked) {
    for (const l of net.labels) {
      const t = String(l.node), wdt = 8 + 6.5 * t.length;
      const bx = l.x * G - wdt - 4, by = l.y * G - 19;
      m += '<g class="badge"><rect x="' + bx + '" y="' + by + '" width="' + wdt + '" height="15" rx="7.5"/>' +
           '<text x="' + (bx + wdt / 2) + '" y="' + (by + 11) + '" text-anchor="middle">' + t + '</text></g>';
    }
  }
  $('gMarks').innerHTML = m;
  renderOverlay();
  renderNetlistPane();
  updateStatus();
  autosave();
}

function renderOverlay() {
  let s = '';
  if (S.TYPES[tool]) s = compSVG({ id: 'ghost', type: tool, x: mouseG[0], y: mouseG[1], rot: placeRot, params: {} }, 'ghost');
  if (tool === 'wire') {
    s += '<circle cx="' + mouseG[0] * G + '" cy="' + mouseG[1] * G + '" r="4" fill="none" stroke="#21A99B" stroke-width="1.5"/>';
    if (wireStart) {
      s += '<path class="preview" d="M' + wireStart[0] * G + ' ' + wireStart[1] * G + ' H' + mouseG[0] * G + ' V' + mouseG[1] * G + '"/>';
    }
  }
  $('gOverlay').innerHTML = s;
}

function updateStatus(msg, kind) {
  const st = $('status');
  if (msg !== undefined) { st.textContent = msg; st.className = kind || ''; return; }
  if (raw != null) { st.textContent = 'Netlist without a drawing: ready to run'; st.className = ''; return; }
  if (net.errors.length) { st.textContent = '⚠ ' + net.errors[0] + (net.errors.length > 1 ? ' (+' + (net.errors.length - 1) + ' more)' : ''); st.className = 'err'; }
  else {
    st.textContent = (net.phases === 3 ? net.nodeCount + ' three-phase nodes (' + net.netlistNodes + ' in the netlist)' : net.nodeCount + ' nodes') +
                     ', ' + net.lines.length + ' elements' + (net.warnings.length ? ' · ' + net.warnings.length + ' warning(s)' : '');
    st.className = '';
  }
}

// ------------------------------------------------------------------ properties panel
function renderProps() {
  const p = $('props');
  if (sel && sel.kind === 'comp') {
    const c = model.components.find((k) => k.id === sel.id);
    if (!c) { sel = null; return renderProps(); }
    const T = S.TYPES[c.type];
    const nodes = net && net.componentNodes.get(c.id);
    let h = '<h3>' + T.label + '</h3>';
    if (c.type === 'F3') {
      h += '<div class="sub">' + (nodes ? 'At three-phase node ' + nodes[0] + '.' : '') +
           ' Phase-to-phase faults (ab, bc, ca, abc) connect the phases to each other; "-g" types also connect them to ground.</div>';
      h += field('name', 'Name', c.name, '', 'text');
    } else if (c.type !== 'GND') {
      h += '<div class="sub">' + (nodes ? 'From node ' + nodes[0] + ' to node ' + nodes[1] +
           (c.type === 'V' || c.type === 'V3' ? ' (+ at node ' + nodes[1] + ')' : '') : '') +
           (T.three ? '. Applies to phases a, b and c.' : '') + '</div>';
      h += field('name', 'Name', c.name, '', 'text');
    } else {
      h += '<div class="sub">Node 0. Every ground symbol is the same node' + (model.phases === 3 ? ', for all three phases.' : '.') + '</div>';
    }
    for (const prm of S.activeParams(c)) {
      h += prm.kind === 'select'
        ? '<div class="field"><label>' + prm.label + '</label><div class="row"><select data-param="' + prm.key + '">' +
          prm.options.map((o) => '<option' + (c.params[prm.key] === o ? ' selected' : '') + '>' + o + '</option>').join('') + '</select></div></div>'
        : field(prm.key, prm.label, c.params[prm.key], prm.unit, prm.kind || 'value');
    }
    if (c.type !== 'GND') h += '<div class="help">Values accept SI prefixes: 3m = 0.003, 30u = 30e-6, 1.5k = 1500, 20ms = 0.02 s.</div>';
    h += '<div class="btnrow"><button id="pRot">Rotate (R)</button><button id="pDel">Delete (Del)</button></div>';
    p.innerHTML = h;
    p.querySelectorAll('input[data-param], select[data-param]').forEach((inp) => {
      inp.addEventListener('focus', () => { inp.dataset.undo = '1'; });
      inp.addEventListener('input', () => {
        if (inp.dataset.undo) { pushUndo(); delete inp.dataset.undo; }
        const k = inp.dataset.param;
        if (k === 'name') c.name = inp.value; else c.params[k] = inp.value;
        if (k === 'mode') carryOverPhaseSettings(c);
        updateParsed(inp, k, c);
        render();
        if (k === 'mode') renderProps();   // together <-> independent changes which fields are shown
      });
      updateParsed(inp, inp.dataset.param, c);
    });
    $('pRot').onclick = () => rotateSelected();
    $('pDel').onclick = () => deleteSelected();
  } else if (sel && sel.kind === 'wire') {
    p.innerHTML = '<h3>Wire</h3><div class="sub">Connects everything at its two ends and anything that ends on it.</div>' +
                  '<div class="btnrow"><button id="pDel">Delete (Del)</button></div>';
    $('pDel').onclick = () => deleteSelected();
  } else {
    const counts = {};
    for (const c of model.components) counts[c.type] = (counts[c.type] || 0) + 1;
    let h = '<h3>Circuit</h3>';
    if (raw != null) h += '<div class="sub">Loaded a netlist without a drawing. ▶ Run works; drawing anything starts a new circuit.</div>';
    const three = model.phases === 3;
    h += '<div class="kv"><b>Mode</b><span>' + (three ? 'three-phase' : 'single-phase') + '</span>' +
         '<b>Nodes</b><span>' + (net ? net.nodeCount : 0) + (three && net ? ' × 3 phases = ' + net.netlistNodes : '') + '</span>' +
         Object.keys(S.TYPES).filter((t) => counts[t]).map((t) => '<b>' + S.TYPES[t].label + '</b><span>' + counts[t] + '</span>').join('') +
         '</div>';
    const st = model.settings || {};
    h += '<h3 style="margin-top:6px">Run settings</h3>' +
         field('set_dt', 'Time step (blank = 100 µs)', st.dt || '', 's', 'value') +
         field('set_tstop', 'Duration (blank = 0.1 s)', st.tstop || '', 's', 'value') +
         '<div class="field"><label><input type="checkbox" data-opt="interp"' + (st.interp === 'off' ? '' : ' checked') +
         '> Switch at the exact instant (interpolation)</label></div>' +
         '<div class="field"><label><input type="checkbox" data-opt="chatter"' + (st.chatter === 'off' ? '' : ' checked') +
         '> Chatter removal (critical damping adjustment)</label></div>';
    if (net) h += msgList(net);
    h += '<h3 style="margin-top:14px">How to draw</h3><ul class="help">' +
         '<li>Pick a component on the left and click to place it. Press <b>R</b> to rotate.</li>' +
         '<li>Use <b>Wire</b> (W) to connect terminals. A wire that ends on another wire joins it.</li>' +
         '<li>Add at least one <b>Ground</b>: it is node 0.</li>' +
         '<li>Node numbers (teal badges) are the V1, V2… in the plots.</li>' +
         '<li><b>3-phase</b> (selector at the top): wires, buses and parts carry phases a, b, c (drawn with ///). ' +
         'Node k is netlist node 3k−2 (a), 3k−1 (b), 3k (c), and each plot shows all three phases. ' +
         'Switch poles and fault phases can act together or independently.</li>' +
         '<li><b>Results</b>: choose Voltages or Currents above the plots. Currents include machine speed, angle, power and torque.</li>' +
         '<li>A source raises its <b>+</b> end above its − end. An ideal source (no resistance) needs one end on ground.</li>' +
         '<li>A red ring marks a terminal that is not connected.</li>' +
         '<li><b>Save</b> writes circuits/&lt;name&gt;.net, which also runs with .\\run.bat circuits\\&lt;name&gt;.net</li></ul>';
    p.innerHTML = h;
    // run settings (stored in the drawing, written as .tran and .options lines)
    p.querySelectorAll('input[data-opt]').forEach((inp) => {
      inp.addEventListener('change', () => {
        pushUndo();
        const st = Object.assign({}, model.settings);
        if (inp.checked) delete st[inp.dataset.opt]; else st[inp.dataset.opt] = 'off';
        model.settings = st;
        render();
      });
    });
    p.querySelectorAll('input[data-param^="set_"]').forEach((inp) => {
      const k = inp.dataset.param.slice(4);
      const show = () => {
        const out = inp.closest('.field').querySelector('.parsed');
        const x = S.parseValue(inp.value);
        out.textContent = x === null ? 'default' : Number.isNaN(x) ? 'Not a number' : '= ' + S.formatSI(x, 's');
        out.className = 'parsed' + (Number.isNaN(x) ? ' bad' : '');
      };
      inp.addEventListener('focus', () => { inp.dataset.undo = '1'; });
      inp.addEventListener('input', () => {
        if (inp.dataset.undo) { pushUndo(); delete inp.dataset.undo; }
        model.settings = Object.assign({}, model.settings, { [k]: inp.value });
        show(); render();
      });
      show();
    });
  }
}
// Switching poles/phases between "together" and "independent" keeps the settings:
// to independent, every pole/phase starts from the common settings; to together, phase a's are used.
function carryOverPhaseSettings(c) {
  const P = c.params;
  const keys = c.type === 'SW3' ? ['state', 'times'] : c.type === 'F3' ? ['t_apply', 't_clear'] : [];
  for (const k of keys) {
    if (P.mode === 'independent') { if (P[k] !== undefined) for (const p of S.PH) P[k + '_' + p] = P[k]; }
    else if (P[k + '_a'] !== undefined) P[k] = P[k + '_a'];
  }
}
function field(key, label, value, unit, kind) {
  return '<div class="field"><label>' + label + '</label><div class="row"><input type="text" data-param="' + key + '" data-kind="' + kind +
         '" value="' + String(value == null ? '' : value).replace(/"/g, '&quot;') + '"><span class="unit">' + (unit || '') +
         '</span></div>' + (kind === 'text' ? '' : '<div class="parsed"></div>') + '</div>';
}
function updateParsed(inp, key, c) {
  const out = inp.closest('.field').querySelector('.parsed');
  if (!out) return;
  const prm = S.TYPES[c.type].params.find((p) => p.key === key);
  if (!prm) return;
  if (prm.kind === 'list') {
    const ts = S.parseList(inp.value);
    const bad = ts.some((t) => Number.isNaN(t));
    out.textContent = bad ? 'Not all numbers' : ts.length ? ts.map((t) => S.formatSI(t, 's')).join(', ') : 'never switches';
    out.className = 'parsed' + (bad ? ' bad' : '');
  } else {
    const v = S.parseValue(inp.value);
    out.textContent = v === null ? (prm.optional ? 'blank' : 'required') : Number.isNaN(v) ? 'Not a number' : '= ' + S.fmt(v) + ' ' + (prm.unit || '');
    out.className = 'parsed' + ((v === null && !prm.optional) || Number.isNaN(v) ? ' bad' : '');
  }
}
function msgList(n) {
  if (!n.errors.length && !n.warnings.length) return '<ul class="msgs"><li class="w" style="background:#E8F6F4;color:#14675E">No problems found.</li></ul>';
  return '<ul class="msgs">' + n.errors.map((e) => '<li class="e">' + e + '</li>').join('') +
         n.warnings.map((w) => '<li class="w">' + w + '</li>').join('') + '</ul>';
}

function renderNetlistPane() {
  if (raw != null) { $('netMsgs').innerHTML = ''; $('netText').textContent = raw; return; }
  $('netMsgs').innerHTML = net.errors.length || net.warnings.length ? msgList(net).replace(/^<ul class="msgs">|<\/ul>$/g, '') : '';
  $('netText').textContent = net.text.replace(/^#@layout .*$/m, (l) => '#@layout … (drawing data, ' + l.length + ' characters)');
}

// ------------------------------------------------------------------ editing
function pushUndo() {
  undoStack.push(JSON.stringify(model)); if (undoStack.length > 200) undoStack.shift();
  redoStack = []; dirty = true;
  if (raw != null) { raw = null; $('banner').style.display = 'none'; }
}
function restore(json) { model = JSON.parse(json); sel = null; syncPhaseUI(); render(); renderProps(); }
function undo() { if (undoStack.length) { redoStack.push(JSON.stringify(model)); restore(undoStack.pop()); } }
function redo() { if (redoStack.length) { undoStack.push(JSON.stringify(model)); restore(redoStack.pop()); } }

function select(s) { sel = s; render(); renderProps(); }
function rotateSelected() {
  if (!sel || sel.kind !== 'comp') return;
  const c = model.components.find((k) => k.id === sel.id);
  if (!c || S.singleTerminal(c.type)) return;
  pushUndo();
  const d = S.DIRS[c.rot || 0], cx = c.x + d[0] * 2, cy = c.y + d[1] * 2;   // rotate about the centre
  c.rot = ((c.rot || 0) + 90) % 360;
  const n = S.DIRS[c.rot];
  c.x = cx - n[0] * 2; c.y = cy - n[1] * 2;
  render(); renderProps();
}
function deleteSelected() {
  if (!sel) return;
  pushUndo();
  if (sel.kind === 'comp') model.components = model.components.filter((c) => c.id !== sel.id);
  else model.wires.splice(sel.index, 1);
  select(null);
}

const same = (a, b) => a[0] === b[0] && a[1] === b[1];
function isConnectionPoint(p) {
  for (const c of model.components) for (const t of S.terminals(c)) if (same(t, p)) return true;
  for (const w of model.wires) if (S.onSegment(p, w)) return true;
  return false;
}
function addSeg(a, b) { if (!same(a, b)) model.wires.push({ x1: a[0], y1: a[1], x2: b[0], y2: b[1] }); }
function wireClick(g) {
  if (!wireStart) { wireStart = g; updateHint(); return; }
  if (same(g, wireStart)) { wireStart = null; updateHint(); renderOverlay(); return; }
  const finish = isConnectionPoint(g);
  pushUndo();
  const corner = [g[0], wireStart[1]];
  addSeg(wireStart, corner); addSeg(corner, g);
  wireStart = finish ? null : g;
  updateHint(); render(); renderProps();
}

// ------------------------------------------------------------------ mouse
const snap = (p) => [Math.round(p[0] / G), Math.round(p[1] / G)];
svg.addEventListener('contextmenu', (e) => e.preventDefault());
svg.addEventListener('mousedown', (ev) => {
  const g = snap(toWorld(ev));
  if (ev.button === 1 || (ev.button === 0 && tool === 'select' && !ev.target.closest('[data-id],[data-wire]'))) {
    pan = { cx: ev.clientX, cy: ev.clientY, vx: view.x, vy: view.y };
    svg.classList.add('pan');
    if (ev.button === 0 && sel) select(null);
    return;
  }
  if (ev.button === 2) {
    if (tool === 'wire' && wireStart) { wireStart = null; updateHint(); renderOverlay(); } else setTool('select');
    return;
  }
  if (ev.button !== 0) return;
  if (tool === 'wire') return wireClick(g);
  if (S.TYPES[tool]) {
    pushUndo();
    const c = S.makeComponent(tool, g[0], g[1], S.singleTerminal(tool) ? 0 : placeRot, model.components);
    model.components.push(c);
    sel = { kind: 'comp', id: c.id };
    render(); renderProps();
    return;
  }
  // select tool
  const compEl = ev.target.closest('[data-id]'), wireEl = ev.target.closest('[data-wire]');
  if (compEl) {
    const c = model.components.find((k) => k.id === compEl.dataset.id);
    select({ kind: 'comp', id: c.id });
    const attached = [];
    S.terminals(c).forEach((t, ti) => model.wires.forEach((w, wi) => {
      if (w.x1 === t[0] && w.y1 === t[1]) attached.push({ wi, end: 1, ti });
      if (w.x2 === t[0] && w.y2 === t[1]) attached.push({ wi, end: 2, ti });
    }));
    drag = { c, g0: g, x0: c.x, y0: c.y, attached, moved: false };
  } else if (wireEl) {
    select({ kind: 'wire', index: Number(wireEl.dataset.wire) });
  }
});
window.addEventListener('mousemove', (ev) => {
  if (pan) {
    view.x = pan.vx - (ev.clientX - pan.cx) / view.s;
    view.y = pan.vy - (ev.clientY - pan.cy) / view.s;
    applyView(); return;
  }
  if (!svg.getScreenCTM()) return;
  const g = snap(toWorld(ev));
  const changed = !same(g, mouseG);
  mouseG = g;
  if (drag) {
    const dx = g[0] - drag.g0[0], dy = g[1] - drag.g0[1];
    if (!drag.moved && (dx || dy)) { pushUndo(); drag.moved = true; }
    if (drag.moved) {
      drag.c.x = drag.x0 + dx; drag.c.y = drag.y0 + dy;
      const ts = S.terminals(drag.c);
      for (const a of drag.attached) {
        const w = model.wires[a.wi];
        if (a.end === 1) { w.x1 = ts[a.ti][0]; w.y1 = ts[a.ti][1]; } else { w.x2 = ts[a.ti][0]; w.y2 = ts[a.ti][1]; }
      }
      if (changed) render();
    }
    return;
  }
  if (changed) renderOverlay();
});
window.addEventListener('mouseup', () => {
  if (pan) { pan = null; svg.classList.remove('pan'); }
  if (drag) { const moved = drag.moved; drag = null; if (moved) renderProps(); }
});
svg.addEventListener('wheel', (ev) => { ev.preventDefault(); zoomAt(ev.deltaY < 0 ? 1.15 : 1 / 1.15, ev.clientX, ev.clientY); }, { passive: false });
$('zIn').onclick = () => zoomAt(1.25); $('zOut').onclick = () => zoomAt(0.8); $('zFit').onclick = fit;
$('showNodes').onchange = render;

// ------------------------------------------------------------------ keyboard
window.addEventListener('keydown', (ev) => {
  const typing = /^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 's') { ev.preventDefault(); save(); return; }
  if (ev.key === 'F5') { ev.preventDefault(); run(); return; }
  if (typing) { if (ev.key === 'Escape') document.activeElement.blur(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); ev.shiftKey ? redo() : undo(); return; }
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'y') { ev.preventDefault(); redo(); return; }
  if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === 'r') { if (S.TYPES[tool]) { placeRot = (placeRot + 90) % 360; renderOverlay(); } else rotateSelected(); }
  else if (k === 'w') setTool('wire');
  else if (ev.key === 'Delete' || ev.key === 'Backspace') { ev.preventDefault(); deleteSelected(); }
  else if (ev.key === 'Escape') { if (tool === 'wire' && wireStart) { wireStart = null; updateHint(); renderOverlay(); } else { setTool('select'); if (sel) select(null); } }
});

// ------------------------------------------------------------------ files
function baseName() { return ($('fileName').value || 'my_circuit').trim().replace(/\.net$/i, ''); }
function currentText() { return raw != null ? raw : net.text; }
async function api(path, body) {
  const r = await fetch(path, body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {});
  const data = await r.json();
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
}
async function save() {
  if (raw == null && net.errors.length) { showTab('netlist'); updateStatus('Fix the errors before saving: ' + net.errors[0], 'err'); return; }
  try {
    const r = await api('/api/save', { name: baseName(), text: currentText() });
    dirty = false;
    updateStatus('Saved ' + r.saved + '. Run it from a terminal with  .\\run.bat ' + r.saved.replace('/', '\\'), 'ok');
  } catch (e) { updateStatus('Save failed: ' + e.message, 'err'); }
}
function download() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([currentText()], { type: 'text/plain' }));
  a.download = baseName() + '.net'; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function loadText(name, text) {
  const f = S.parseFile(text);
  $('fileName').value = name.replace(/\.net$/i, '');
  undoStack = []; redoStack = []; sel = null; dirty = false; results = null; renderResults();
  if (f.model) {
    model = f.model; raw = null; $('banner').style.display = 'none';
  } else {
    model = { v: 1, components: [], wires: [] }; raw = text;
    $('banner').innerHTML = '<b>' + name + '</b> has no drawing (it was written by hand or generated), so it cannot be edited here. ▶ Run works, and the Netlist tab shows the file.';
    $('banner').style.display = 'block';
  }
  syncPhaseUI(); render(); renderProps(); fit();
}
async function openDialog() {
  $('openDialog').classList.remove('hidden');
  $('openList').innerHTML = '<div class="empty">Loading…</div>';
  try {
    const { files } = await api('/api/circuits');
    $('openList').innerHTML = files.length ? '' : '<div class="empty">No .net files in circuits/ yet.</div>';
    for (const f of files) {
      const d = document.createElement('div');
      d.className = 'item';
      d.innerHTML = '<span>' + f.name + '</span><small>' + (f.drawing ? 'drawing' : 'netlist only (run, not edit)') + '</small>';
      d.onclick = async () => {
        try { const r = await api('/api/circuit?name=' + encodeURIComponent(f.name)); loadText(r.name, r.text); closeOpen(); }
        catch (e) { updateStatus('Open failed: ' + e.message, 'err'); }
      };
      $('openList').appendChild(d);
    }
  } catch (e) { $('openList').innerHTML = '<div class="empty">Could not list circuits: ' + e.message + '</div>'; }
}
function closeOpen() { $('openDialog').classList.add('hidden'); }
$('btnOpen').onclick = openDialog; $('btnCloseOpen').onclick = closeOpen;
$('openDialog').onclick = (e) => { if (e.target === $('openDialog')) closeOpen(); };
$('btnUpload').onclick = (e) => { e.preventDefault(); $('fileInput').click(); };
$('fileInput').onchange = async () => {
  const f = $('fileInput').files[0]; if (!f) return;
  loadText(f.name, await f.text()); closeOpen(); $('fileInput').value = '';
};
$('btnSave').onclick = save; $('btnDownload').onclick = download;
$('btnNew').onclick = () => {
  if (dirty && !confirm('Discard the current circuit?')) return;
  model = { v: 1, phases: +$('phaseMode').value === 3 ? 3 : 1, components: [], wires: [] }; raw = null; $('banner').style.display = 'none';
  undoStack = []; redoStack = []; sel = null; dirty = false; $('fileName').value = 'my_circuit';
  results = null; renderResults(); syncPhaseUI(); render(); renderProps(); fit();
};
$('fileName').addEventListener('input', () => render());

// Changing between single- and three-phase converts the drawing (R, L, C, sources, switches, faults)
$('phaseMode').onchange = () => {
  const ph = $('phaseMode').value === '3' ? 3 : 1;
  if ((model.phases === 3 ? 3 : 1) === ph) return;
  const parts = model.components.some((c) => c.type !== 'GND');
  if (parts && !confirm('Convert the drawing to ' + (ph === 3 ? 'three' : 'single') + '-phase?\n\n' +
      (ph === 3 ? 'Every R, L, C, source and switch becomes its three-phase version with the same values. ' +
                  'Faults become three-phase faults to ground (abc-g).'
                : 'Every part becomes single-phase. Independent switch poles and fault phases keep phase a\'s settings.') +
      '\n\nYou can undo this with Ctrl+Z.')) { $('phaseMode').value = model.phases === 3 ? '3' : '1'; return; }
  if (parts) pushUndo();
  if (raw != null) { raw = null; $('banner').style.display = 'none'; }
  model = S.convertPhases(model, ph);
  sel = null; results = null; renderResults();
  syncPhaseUI(); render(); renderProps();
};

function autosave() {
  try { localStorage.setItem('emtsim-editor', JSON.stringify({ model: S.serialize(model), raw, name: $('fileName').value })); } catch (e) { /* storage unavailable */ }
}

// ------------------------------------------------------------------ run + results
async function run() {
  if (raw == null && net.errors.length) { showTab('netlist'); updateStatus('Fix the errors before running: ' + net.errors[0], 'err'); return; }
  const engine = $('engine').value;
  $('btnRun').disabled = true; $('btnRun').textContent = '… Running';
  updateStatus('Running the ' + { cpp: 'C++', python: 'Python', both: 'C++ and Python' }[engine] + ' simulator…');
  try {
    const meta = raw == null ? { phases: net.phases, drawNodes: net.nodeCount } : { phases: 1, drawNodes: 0 };
    const res = Object.assign(await api('/api/run', { text: currentText(), engine }), meta);
    if ($('hold').checked) {           // compare with the held run; the first run while ticked becomes it
      if (held) res.overlay = held; else held = snapshot(res, currentText());
    }
    results = res;
    if (!$('hold').checked) plotZoom = null;
    const errs = ['cpp', 'python'].filter((k) => results[k] && results[k].error).map((k) => (k === 'cpp' ? 'C++' : 'Python') + ': ' + results[k].error);
    $('logText').textContent = ['cpp', 'python'].filter((k) => results[k]).map((k) =>
      '=== ' + (k === 'cpp' ? 'C++' : 'Python') + ' ===\n' + (results[k].error ? 'ERROR: ' + results[k].error + '\n' : '') + (results[k].log || '(no switching events)')).join('\n\n');
    if (errs.length) { updateStatus(errs[0], 'err'); showTab('log'); }
    else { updateStatus('Simulation finished', 'ok'); showTab('results'); }
    renderResults();
  } catch (e) {
    updateStatus('Could not run: ' + e.message + (location.protocol === 'file:' ? ' (start the editor with gui.bat)' : ''), 'err');
  } finally {
    $('btnRun').disabled = false; $('btnRun').textContent = '▶ Run';
  }
}
$('btnRun').onclick = run;

// Hold run: the reference a later run is compared with (the grey dashed overlay)
let held = null;
function optionsOf(text) {        // chatter / interp states of a netlist, as in its .options line (default on)
  const st = { chatter: 'on', interp: 'on' };
  for (const m of text.matchAll(/^\s*\.options\s+(.*)$/gim))
    for (const kv of m[1].split(/\s+/)) { const [k, v] = kv.split('='); if (k in st && v) st[k] = /^(on|1|true|yes)$/i.test(v) ? 'on' : 'off'; }
  return st;
}
function snapshot(res, text) {
  const run = res.cpp && !res.cpp.error ? res.cpp : res.python && !res.python.error ? res.python : null;
  if (!run) return null;
  const o = optionsOf(text);
  return Object.assign({ label: 'held run: ' + (run === res.cpp ? 'C++' : 'Python') + ', chatter ' + o.chatter + ', interp ' + o.interp }, run);
}
function holdChip() {
  if (!$('hold').checked) return '';
  return '<span class="chip" style="background:#FFF6E6">' + (held ? 'holding: ' + held.label.replace('held run: ', '') + ' · change a setting and ▶ Run to compare'
                                                                  : 'the next run will be held') + '</span>';
}
$('hold').addEventListener('change', () => {
  held = $('hold').checked && results ? snapshot(results, currentText()) : null;
  if (!$('hold').checked && results) delete results.overlay;
  renderResults();
});

function parseFilter(s, n) {
  s = (s || '').trim().toLowerCase();
  if (!s || s === 'all') return [...Array(n).keys()];
  const out = new Set();
  for (const part of s.split(/[,\s]+/).filter(Boolean)) {
    const m = part.match(/^v?(\d+)(?:-v?(\d+))?$/);
    if (!m) continue;
    const a = +m[1], b = m[2] ? +m[2] : a;
    for (let k = Math.min(a, b); k <= Math.max(a, b); k++) if (k >= 1 && k <= n) out.add(k - 1);
  }
  return [...out].sort((x, y) => x - y);
}

function fmtNum(v) {
  const a = Math.abs(v);
  if (a >= 1e4) return (v / 1e3).toFixed(0) + 'k';
  if (a >= 1e3) return (v / 1e3).toFixed(1) + 'k';
  if (a >= 100) return v.toFixed(0);
  if (a >= 1) return v.toFixed(1);
  return v.toPrecision(2);
}

const PHASE_COLORS = ['#D64545', '#E0A020', '#2F6FD6'];   // phases a, b, c
const BIG_BUTTON = '<button class="big" title="Enlarge this plot">⤢</button>';
const ZOOM_CHIP = '<span class="chip" id="zoomChip" style="display:none;background:#E3F4F2">zoom <b></b> ' +
                  '<button class="lnk" onclick="setZoom(null)">Reset zoom</button></span>' +
                  '<span class="legend">drag across a plot to zoom · wheel to zoom · double-click to reset · ⤢ to enlarge</span>';
function renderResults() {
  const box = $('plots'), sum = $('summary');
  plotItems = [];
  if (!results) { sum.innerHTML = ''; box.innerHTML = '<div class="empty">Draw a circuit and press ▶ Run to see the node voltages here.</div>'; return; }
  const cpp = results.cpp && !results.cpp.error ? results.cpp : null;
  const py = results.python && !results.python.error ? results.python : null;
  const main = cpp || py;
  if (!main) { sum.innerHTML = ''; box.innerHTML = '<div class="empty">The simulation failed: see the Log tab.</div>'; return; }
  if ($('resultKind').value === 'I') return renderCurrents(cpp, py, main, sum, box);
  // Three-phase drawing: netlist nodes 3k-2, 3k-1, 3k are phases a, b, c of drawing node k
  const three = results.phases === 3 && main.V.length === 3 * results.drawNodes;
  const groups = three ? results.drawNodes : main.V.length;
  const chips = [];
  chips.push('<span class="chip"><b>' + groups + '</b> ' + (three ? 'three-phase nodes (' + main.V.length + ' phase voltages)' : 'nodes') +
             ' · <b>' + main.t.length + '</b> steps</span>');
  if (cpp && cpp.sim_ms != null) chips.push('<span class="chip">C++ <b>' + cpp.sim_ms.toFixed(2) + ' ms</b></span>');
  if (py) chips.push('<span class="chip">Python <b>' + py.sim_ms.toFixed(1) + ' ms</b></span>');
  if (results.compare) {
    const c = results.compare;
    if (c.speedup) chips.push('<span class="chip">C++ <b>' + c.speedup.toFixed(0) + '×</b> faster</span>');
    chips.push('<span class="chip">max |Python − C++| <b>' + (c.max_diff === 0 ? '0 V (identical)' : c.max_diff.toExponential(2) + ' V') + '</b></span>');
  }
  const ov = overlayFor(main, 'V', 'V');
  if (three) {
    chips.push(PHASE_COLORS.map((c, p) => '<span class="legend"><i style="border-top-color:' + c + '"></i>' + S.PH[p] + '</span>').join('') +
               (cpp && py ? '<span class="legend">C++ solid, <i class="py"></i>Python</span>' : ''));
  } else {
    chips.push(cpp && py ? '<span class="legend"><i></i>C++</span><span class="legend"><i class="py"></i>Python</span>'
                         : '<span class="legend"><i' + (cpp ? '' : ' style="border-top-color:var(--orange)"') + '></i>' + (cpp ? 'C++' : 'Python') + '</span>');
  }
  if (ov) chips.push(ov.chips);
  chips.push(holdChip());
  sum.innerHTML = chips.join('') + ZOOM_CHIP;

  let idx = parseFilter($('nodeFilter').value, groups);
  const MAXPLOTS = 60;
  const capped = idx.length > MAXPLOTS && /^\s*(all)?\s*$/i.test($('nodeFilter').value);
  if (capped) idx = idx.slice(0, MAXPLOTS);
  if (capped) sum.innerHTML += '<span class="chip" style="background:#FFF6E6">showing the first ' + MAXPLOTS + ' of ' +
                               groups + ' nodes: type e.g. <b>100-160</b> in Show nodes</span>';
  box.innerHTML = '';
  for (const k of idx) {
    const card = document.createElement('div');
    card.className = 'card';
    const cols = three ? [3 * k, 3 * k + 1, 3 * k + 2] : [k];
    const peak = Math.max(...cols.map((j) => Math.max(...main.V[j].map(Math.abs))));
    const title = three ? 'Node ' + (k + 1) + ' <span style="margin-left:6px">a/b/c = V' + (3 * k + 1) + '–V' + (3 * k + 3) + '</span>' : main.names[k];
    card.innerHTML = '<div class="ttl"><b>' + title + '</b><span>peak ' + fmtNum(peak) + ' V' + BIG_BUTTON + '</span></div><canvas></canvas>';
    box.appendChild(card);
    const cv = card.querySelector('canvas');
    const series = [];
    cols.forEach((j, p) => {
      const color = three ? PHASE_COLORS[p] : null;
      if (cpp) series.push({ v: cpp.V[j], color: color || '#21A99B', width: cpp && py ? 2 : 1.3 });
      if (py) series.push(cpp ? { v: py.V[j], color: '#1F2537', width: 1, dash: [3, 3] } : { v: py.V[j], color: color || '#E8833A', width: 1.3 });
    });
    if (ov) cols.forEach((j) => series.push({ v: ov.run.V[j], color: '#8A8F98', width: 1.2, dash: [6, 4] }));
    const item = { t: main.t, series, events: main.events, hover: null,
                   labels: three ? S.PH.map((p, j) => ({ name: p, s: series[j * (cpp && py ? 2 : 1)] })) : null };
    attachPlot(card, cv, item);
  }
  if (!idx.length) box.innerHTML = '<div class="empty">No nodes match the filter.</div>';
  updateZoomChip();
}
$('nodeFilter').addEventListener('input', renderResults);
$('resultKind').addEventListener('change', () => {
  $('filterLabel').firstChild.textContent = $('resultKind').value === 'I' ? 'Show ' : 'Show nodes ';
  renderResults();
});

// The overlay run (same circuit, options forced on or off), if it exists and matches: its series key
// (V or I) and the chips describing it
function overlayFor(main, key, unit) {
  const o = results.overlay;
  if (!o) return null;
  if (o.error) return { run: null, chips: '<span class="chip" style="background:#FDECEC">overlay failed: ' + o.error + '</span>' };
  if (!o[key] || o[key].length !== main[key].length || o.t.length !== main.t.length)
    return { run: null, chips: '<span class="chip" style="background:#FDECEC">' + o.label + ' has a different time grid or circuit, so it cannot be overlaid</span>' };
  let d = 0;
  for (let j = 0; j < main[key].length; j++)
    for (let i = 0; i < main.t.length; i++) d = Math.max(d, Math.abs(main[key][j][i] - o[key][j][i]));
  return { run: o, chips: '<span class="legend"><i class="ov"></i>' + o.label + '</span>' +
                          '<span class="chip">max difference <b>' + (d === 0 ? '0' : d.toPrecision(3)) + ' ' + unit + '</b></span>' };
}

// Branch currents (and machine speed, angle, power, torque): one card per element; the three
// phases of a three-phase element (names ending .a, .b, .c) share a card
function renderCurrents(cpp, py, main, sum, box) {
  const names = main.cnames || [];
  if (!names.length) { sum.innerHTML = ''; box.innerHTML = '<div class="empty">No branch currents were recorded (rebuild the C++ simulator).</div>'; return; }
  const ovI = overlayFor(main, 'I', '');
  const groups = [];
  for (let k = 0; k < names.length; k++) {
    const m = names[k].match(/^(.*)\.a$/);
    if (m && names[k + 1] === m[1] + '.b' && names[k + 2] === m[1] + '.c') { groups.push({ name: m[1], cols: [k, k + 1, k + 2] }); k += 2; }
    else groups.push({ name: names[k], cols: [k] });
  }
  const f = ($('nodeFilter').value || '').trim().toLowerCase();
  let shown = f && f !== 'all' ? groups.filter((g) => g.name.toLowerCase().includes(f)) : groups;
  const MAX = 60, capped = shown.length > MAX;
  if (capped) shown = shown.slice(0, MAX);
  sum.innerHTML = '<span class="chip"><b>' + groups.length + '</b> elements · <b>' + names.length + '</b> signals</span>' +
    '<span class="legend">currents flow from the first terminal into the element; [pu] and [deg] are machine quantities</span>' +
    (capped ? '<span class="chip" style="background:#FFF6E6">showing the first ' + MAX + ': type part of a name in Show</span>' : '') +
    (ovI ? ovI.chips : '') + holdChip() + ZOOM_CHIP;
  box.innerHTML = '';
  for (const g of shown) {
    const card = document.createElement('div');
    card.className = 'card';
    const unit = /\[(.*)\]$/.exec(g.name);
    const u = unit ? unit[1] : 'A';
    const peak = Math.max(...g.cols.map((j) => Math.max(...main.I[j].map(Math.abs))));
    card.innerHTML = '<div class="ttl"><b>' + g.name.replace(/</g, '&lt;') + '</b><span>peak ' + fmtNum(peak) + ' ' + u + BIG_BUTTON + '</span></div><canvas></canvas>';
    box.appendChild(card);
    const cv = card.querySelector('canvas');
    const series = [];
    g.cols.forEach((j, p) => {
      const color = g.cols.length === 3 ? PHASE_COLORS[p] : null;
      if (cpp && cpp.I) series.push({ v: cpp.I[j], color: color || '#21A99B', width: cpp && py ? 2 : 1.3 });
      if (py && py.I) series.push(cpp ? { v: py.I[j], color: '#1F2537', width: 1, dash: [3, 3] } : { v: py.I[j], color: color || '#E8833A', width: 1.3 });
    });
    if (ovI) g.cols.forEach((j) => series.push({ v: ovI.run.I[j], color: '#8A8F98', width: 1.2, dash: [6, 4] }));
    const item = { t: main.t, series, events: main.events, hover: null, unit: u,
                   labels: g.cols.length === 3 ? S.PH.map((p, j) => ({ name: p, s: series[j * (cpp && py ? 2 : 1)] })) : null };
    attachPlot(card, cv, item);
  }
  if (!shown.length) box.innerHTML = '<div class="empty">No element names match the filter.</div>';
  updateZoomChip();
}

// Time window shown by all plots (null = everything); shared, so the plots stay aligned
let plotZoom = null;
let plotItems = [];      // { cv, item } of the plots on screen

function drawPlot(cv, item) {
  const dpr = window.devicePixelRatio || 1;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  const L = 46, R = 6, T = 6, B = 16, pw = W - L - R, ph = H - T - B;
  const t = item.t, n = t.length;
  const t0 = plotZoom ? plotZoom[0] : t[0], t1 = plotZoom ? plotZoom[1] : t[n - 1];
  // samples in the window (one more on each side so the lines reach the edges)
  let i0 = 0, i1 = n - 1;
  while (i0 < n - 1 && t[i0 + 1] < t0) i0++;
  while (i1 > 0 && t[i1 - 1] > t1) i1--;
  let lo = Infinity, hi = -Infinity;
  for (const s of item.series) for (let i = i0; i <= i1; i++) { const v = s.v[i]; if (v < lo) lo = v; if (v > hi) hi = v; }
  if (!(hi > lo)) { const m = Math.abs(hi) || 1; lo -= 0.01 * m; hi += 0.01 * m; }
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const X = (x) => L + (x - t0) / ((t1 - t0) || 1) * pw;
  const Y = (v) => T + (hi - v) / (hi - lo) * ph;
  item.geom = { L, pw, t0, t1 };
  g.save();
  g.beginPath(); g.rect(L, T, pw, ph); g.clip();
  g.fillStyle = 'rgba(214,69,69,0.10)';
  for (const [a, b] of item.events.faults) g.fillRect(X(a), T, X(b == null ? t[n - 1] : b) - X(a), ph);
  g.strokeStyle = '#A3A9B3'; g.lineWidth = 1; g.setLineDash([3, 3]);
  for (const ts of item.events.switches) { g.beginPath(); g.moveTo(X(ts), T); g.lineTo(X(ts), T + ph); g.stroke(); }
  g.setLineDash([]);
  if (lo < 0 && hi > 0) { g.strokeStyle = '#D5D9DF'; g.beginPath(); g.moveTo(L, Y(0)); g.lineTo(L + pw, Y(0)); g.stroke(); }
  for (const s of item.series) {
    g.strokeStyle = s.color; g.lineWidth = s.width; g.setLineDash(s.dash || []);
    g.beginPath();
    for (let i = i0; i <= i1; i++) { const x = X(t[i]), y = Y(s.v[i]); i > i0 ? g.lineTo(x, y) : g.moveTo(x, y); }
    g.stroke();
  }
  g.setLineDash([]);
  if (item.sel) {   // selection being dragged
    const [xa, xb] = item.sel;
    g.fillStyle = 'rgba(33,169,155,0.15)'; g.fillRect(Math.min(xa, xb), T, Math.abs(xb - xa), ph);
    g.strokeStyle = '#21A99B'; g.strokeRect(Math.min(xa, xb), T, Math.abs(xb - xa), ph);
  }
  g.restore();
  g.strokeStyle = '#E3E6EA'; g.strokeRect(L, T, pw, ph);
  g.fillStyle = '#6B7280'; g.font = '10px Segoe UI, sans-serif'; g.textAlign = 'right'; g.textBaseline = 'middle';
  g.fillText(fmtNum(hi - pad), L - 4, Y(hi - pad)); g.fillText(fmtNum(lo + pad), L - 4, Y(lo + pad));
  if (lo < 0 && hi > 0 && Math.abs(Y(0) - Y(hi - pad)) > 12 && Math.abs(Y(0) - Y(lo + pad)) > 12) g.fillText('0', L - 4, Y(0));
  g.textBaseline = 'top';
  const fmtT = (x) => (x * 1000).toFixed(t1 - t0 < 0.005 ? 2 : t1 - t0 < 0.05 ? 1 : 0);
  g.textAlign = 'left'; g.fillText(fmtT(t0), L, T + ph + 3);
  g.textAlign = 'right'; g.fillText(fmtT(t1) + ' ms', L + pw, T + ph + 3);
  if (item.hover != null && item.hover >= L && item.hover <= L + pw && !item.sel) {
    const tt = t0 + (item.hover - L) / pw * (t1 - t0);
    let i = i0;
    while (i < i1 && Math.abs(t[i + 1] - tt) <= Math.abs(t[i] - tt)) i++;
    const x = X(t[i]);
    g.strokeStyle = '#1F2537'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, T); g.lineTo(x, T + ph); g.stroke();
    const txt = (t[i] * 1000).toFixed(2) + ' ms   ' + (item.labels
      ? item.labels.map((l) => l.name + ' ' + l.s.v[i].toFixed(1)).join('  ') + ' ' + (item.unit || 'V')
      : item.series[0].v[i].toPrecision(5) + ' ' + (item.unit || 'V'));
    g.font = '11px Segoe UI, sans-serif'; g.textBaseline = 'top';
    const tw = g.measureText(txt).width + 10, bx = Math.min(Math.max(x + 6, L), L + pw - tw);
    g.fillStyle = 'rgba(31,37,55,.88)'; g.fillRect(bx, T + 2, tw, 17);
    g.fillStyle = '#fff'; g.textAlign = 'left'; g.fillText(txt, bx + 5, T + 5);
  }
}

function redrawPlots() {
  for (const { cv, item } of plotItems) drawPlot(cv, item);
  updateZoomChip();
}

function setZoom(z) {
  if (z) {
    const all = plotItems.length ? plotItems[0].item.t : null;
    const full0 = all ? all[0] : 0, full1 = all ? all[all.length - 1] : 1;
    let [a, b] = z;
    if (b - a < 2e-6) return;                              // too small to show
    a = Math.max(full0, a); b = Math.min(full1, b);
    z = (a <= full0 && b >= full1) ? null : [a, b];
  }
  plotZoom = z;
  redrawPlots();
}

function updateZoomChip() {
  const chip = $('zoomChip');
  if (!chip) return;
  chip.style.display = plotZoom ? '' : 'none';
  if (plotZoom) chip.querySelector('b').textContent = (plotZoom[0] * 1000).toFixed(2) + ' – ' + (plotZoom[1] * 1000).toFixed(2) + ' ms';
}

// Mouse on a plot: hover read-out, drag to zoom to a time window, wheel to zoom, double-click to reset
function attachPlot(card, cv, item) {
  plotItems.push({ cv, item });
  drawPlot(cv, item);
  const timeAt = (x) => { const gm = item.geom; return gm.t0 + (Math.min(Math.max(x, gm.L), gm.L + gm.pw) - gm.L) / gm.pw * (gm.t1 - gm.t0); };
  cv.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    e.preventDefault();
    item.sel = [e.offsetX, e.offsetX];
    const move = (ev) => {
      const r = cv.getBoundingClientRect();
      item.sel[1] = ev.clientX - r.left;
      drawPlot(cv, item);
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
      const [xa, xb] = item.sel;
      item.sel = null;
      if (Math.abs(xb - xa) > 4) setZoom([timeAt(Math.min(xa, xb)), timeAt(Math.max(xa, xb))]);
      else drawPlot(cv, item);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  });
  cv.addEventListener('mousemove', (e) => { item.hover = e.offsetX; if (!item.sel) drawPlot(cv, item); });
  cv.addEventListener('mouseleave', () => { item.hover = null; if (!item.sel) drawPlot(cv, item); });
  cv.addEventListener('dblclick', () => setZoom(null));
  cv.addEventListener('wheel', (e) => {
    e.preventDefault();
    const gm = item.geom, tc = timeAt(e.offsetX), f = e.deltaY < 0 ? 0.7 : 1 / 0.7;
    setZoom([tc - (tc - gm.t0) * f, tc + (gm.t1 - tc) * f]);
  }, { passive: false });
  // enlarge / shrink this plot
  const big = card.querySelector('.big');
  if (big) big.onclick = () => {
    card.classList.toggle('wide');
    big.textContent = card.classList.contains('wide') ? '⤡' : '⤢';
    drawPlot(cv, item);
  };
}

// ------------------------------------------------------------------ tabs + splitter
function showTab(name) {
  document.querySelectorAll('.tab').forEach((b) => b.classList.toggle('active', b.dataset.tab === name));
  document.querySelectorAll('.pane').forEach((p) => p.classList.toggle('active', p.id === 'pane-' + name));
  if (name === 'results') renderResults();
}
document.querySelectorAll('.tab').forEach((b) => (b.onclick = () => showTab(b.dataset.tab)));
let split = null;
$('splitter').addEventListener('mousedown', (e) => { split = { y: e.clientY, h: $('bottom').offsetHeight }; e.preventDefault(); });
window.addEventListener('mousemove', (e) => {
  if (!split) return;
  const h = Math.max(80, Math.min(window.innerHeight - 200, split.h - (e.clientY - split.y)));
  document.documentElement.style.setProperty('--bottom-h', h + 'px'); applyView();
});
window.addEventListener('mouseup', () => { if (split) { split = null; renderResults(); } });
let resizeTimer = null;
window.addEventListener('resize', () => { applyView(); clearTimeout(resizeTimer); resizeTimer = setTimeout(renderResults, 150); });

// ------------------------------------------------------------------ start
(async function start() {
  syncPhaseUI();
  setTool('select');
  applyView();
  let restored = false;
  try {
    const s = JSON.parse(localStorage.getItem('emtsim-editor') || 'null');
    if (s && ((s.model && s.model.components.length) || s.raw)) {
      $('fileName').value = s.name || 'my_circuit';
      if (s.raw) loadText(s.name || 'circuit', s.raw);
      else { model = S.parseFile('#@layout ' + JSON.stringify(s.model)).model; syncPhaseUI(); render(); renderProps(); fit(); }
      restored = true;
    }
  } catch (e) { /* storage unavailable or corrupt */ }
  if (!restored) {
    render(); renderProps();
    if (location.protocol === 'file:') {
      $('banner').innerHTML = 'Start the editor with <b>gui.bat</b> (or <code>python gui/server.py</code>) so that Run, Open and Save work.';
      $('banner').style.display = 'block';
      return;
    }
    try { const r = await api('/api/circuit?name=example8.net'); loadText(r.name, r.text); } catch (e) { /* no example */ }
  }
  // URL options:  #open=grid100.net  opens a file from circuits/;
  //               #run (or #run=cpp|python|both) runs the circuit straight away.  Combine with &.
  const opts = new URLSearchParams(location.hash.slice(1));
  if (opts.get('open')) {
    try { const r = await api('/api/circuit?name=' + encodeURIComponent(opts.get('open'))); loadText(r.name, r.text); }
    catch (e) { updateStatus('Open failed: ' + e.message, 'err'); }
  }
  if (opts.has('run')) { if (/^(cpp|python|both)$/.test(opts.get('run'))) $('engine').value = opts.get('run'); run(); }
})();
</script>
